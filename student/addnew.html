<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Student</title>

<link rel="stylesheet" href="student.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">

</head>

<body>

<div class="mainCountainer">

   


<!-- MAIN -->
<main class="main">

    <section>

        <div class="Containner">

            <!-- PAGE HEADER -->
            <div class="MainHeader">

                <h2>
                    <span>ADD</span> Student
                </h2>

                <a href="students.html"
                   class="btn btn-outline-primary">
                    Back
                </a>

            </div>


            <!-- FORM -->
            <div class="form-card">

                <form id="addStudentForm">

                    <div class="form-grid">

                        <!-- NAME -->
                        <div class="form-group">

                            <label for="name">
                                Student Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="studentName"
                                name="name"
                                placeholder="Enter student name"
                                required>

                        </div>


                        <!-- STUDENT ID -->
                        <div class="form-group">

                            <label for="studentId">
                                Student ID
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="studentId"
                                name="studentId"
                                placeholder="Example: 20260048"
                                required>

                        </div>


                        <!-- COURSE -->
                        <div class="form-group">

                            <label for="course">
                                Course
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="course"
                                name="course"
                                placeholder="Example: JS101"
                                required>

                        </div>


                        <!-- ARCHIVED -->
                        <div class="form-group">

                            <label for="archived">
                                Student Status
                            </label>

                            <select
                                class="form-select"
                                id="archived"
                                name="archived">

                                <option value="false">
                                    Active
                                </option>

                                <option value="true">
                                    Archived
                                </option>

                            </select>

                        </div>

                    </div>


                            




                    <!-- ATTENDANCE -->
                    <div class="mt-4">

                        <h4>Attendance</h4>

                        <div class="row g-3">

                           
                           


                            <!-- STATUS -->
                            <div class="col-md-6">

                              

                                <select
                                    class="form-select"
                                    id="attendanceStatus">

                                    <option value="">
                                        Select status
                                    </option>

                                    <option value="present">
                                        Present
                                    </option>

                                    <option value="absent">
                                        Absent
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>


                    <!-- BUTTONS -->
                    <div class="form-buttons mt-4">

                        <a href="students.html"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary">
                            Add Student
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </section>

</main>


</div>
<script type="module">
    import { userId } from "../layout.js";
</script>
<script src="addnew.js"></script>

</body>

</html>
