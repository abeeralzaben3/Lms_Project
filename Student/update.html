<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Student</title>

<link rel="stylesheet" href="student.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">

</head>

<body>

<div class="mainCountainer">

    <!-- ============== HEADER ============== -->

        <header class="header">

            <div class="headerCountent">

                <!-- ACCOUNT OPTIONS -->

                <div class="account" id="account">

                    <div class="logo size" id="logo">
                        MH
                    </div>

                    <div class="headerName size" id="name">
                        Muhammad
                    </div>

                    <div>

                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                            <path d="m6 9 6 6 6-6"></path>

                        </svg>

                    </div>

                    <div class="accountMinu" id="accountMinu">
                        <p class="options">acount</p>
                        <p class="options"><a href="">sitting</a></p>
                        <p class="options">Logout</p>
                    </div>

                </div>


                <!-- SEARCH BAR -->

                <div class="search">

                    <button class="icons btn searchBtn1" id="searchBtn">

                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                            <path d="m21 21-4.34-4.34"></path>

                            <circle cx="11" cy="11" r="8"></circle>

                        </svg>

                    </button>


                    <input type="text" class="searchInput" id="searchInput" placeholder="Search">

                </div>
                <!-- BURGER MENU -->
                <div class="burgerMinu" id="burgerMinu">
                    <span class="borderMinu"></span>
                    <span class="borderMinu"></span>
                    <span class="borderMinu"></span>
                </div>


            </div>

        </header>



        <!-- ============== SIDE BAR ============== -->

        <aside class="sideBar" id="sideBar">


            <!-- SIDE HEADER -->

            <div class="sideHeader" id="sideHeader">

                <div class="role">
                    T
                </div>

                <p class="techName">
                    Muhammad Alshawabkeh
                </p>

            </div>


            <!-- NAVIGATION -->

            <nav class="nav">

                <ul class="linksCount">

                    <li class="liLinks">
                        <a href="index.html">
                            Dashboard
                        </a>
                    </li>


                    <li class="liLinks">
                        <a href="students.html">
                            Students
                        </a>
                    </li>


                    <li class="liLinks">
                        <a href="assessments.html">
                            Assessments
                        </a>
                    </li>


                    <li class="liLinks">
                        <a href="reports.html">
                            Reports
                        </a>
                    </li>

                </ul>

            </nav>

        </aside>



<!-- MAIN -->
<main class="main">

    <section>

        <div class="Containner">

            <!-- PAGE HEADER -->
            <div class="MainHeader">

                <h2>
                    <span>UPDATE</span> Student
                </h2>

                <a href="students.html"
                   class="btn btn-outline-primary">
                    Back
                </a>

            </div>


            <!-- FORM -->
            <div class="form-card">

                <form id="addStudentForm">

                    <div class="form-grid">

                        <!-- NAME -->
                        <div class="form-group">

                            <label for="studentName">
                                Student Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="studentName"
                                name="studentName"
                                placeholder="Enter student name"
                                required>

                        </div>


                        <!-- STUDENT ID -->
                        <div class="form-group">

                            <label for="studentId">
                                Student ID
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="studentId"
                                name="studentId"
                                placeholder="Example: 20260048"
                                required>

                        </div>


                        <!-- COURSE -->
                        <div class="form-group">

                            <label for="course">
                                Course
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="course"
                                name="course"
                                placeholder="Example: JS101"
                                required>

                        </div>


                        <!-- ARCHIVED -->
                        <div class="form-group">

                            <label for="archived">
                                Student Status
                            </label>

                            <select
                                class="form-select"
                                id="archived"
                                name="archived">

                                <option value="false">
                                    Active
                                </option>

                                <option value="true">
                                    Archived
                                </option>

                            </select>

                        </div>

                    </div>


                            




                    <!-- ATTENDANCE -->
                    <div class="mt-4">

                        <h4>Attendance</h4>

                        <div class="row g-3">

                           
                           


                            <!-- STATUS -->
                            <div class="col-md-6">

                              

                                <select
                                    class="form-select"
                                    id="attendanceStatus">

                                    <option value="">
                                        Select status
                                    </option>

                                    <option value="present">
                                        Present
                                    </option>

                                    <option value="absent">
                                        Absent
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>


                    <!-- BUTTONS -->
                    <div class="form-buttons mt-4">

                        <a href="students.html"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary">
                            update Student
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </section>

</main>

</div>

<script src="update.js"></script>

</body>

</html>
