<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student</title>
    <link rel="icon" href="data:,">

    <!-- Bootstrap first, then your CSS, so your styles win -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="student.css">
</head>

<body>

    <div class="mainCountainer">


        <!-- ============== HEADER ============== -->

        <header class="header">

            <div class="headerCountent">

                <!-- ACCOUNT OPTIONS -->

                <div class="account" id="account">

                    <div class="logo size" id="logo"></div>

                    <div class="headerName size" id="name"></div>

                    <div>

                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                            <path d="m6 9 6 6 6-6"></path>

                        </svg>

                    </div>

                    <div class="accountMinu" id="accountMinu">
                        <p class="options"><a href="../Settings/index.html">Settings</a></p>
                        <p class="options" id="logout">Logout</p>
                    </div>

                </div>


                <!-- SEARCH BAR -->

                <div class="search">

                    <button type="button" class="icons btn searchBtn" id="searchBtn" aria-label="Search">

                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                            <path d="m21 21-4.34-4.34"></path>

                            <circle cx="11" cy="11" r="8"></circle>

                        </svg>

                    </button>


                    <input type="text" class="searchInput" id="searchInput" placeholder="Search">

                </div>


                <!-- BURGER MENU -->
                <div class="burgerMinu" id="burgerMinu">
                    <span class="borderMinu"></span>
                    <span class="borderMinu"></span>
                    <span class="borderMinu"></span>
                </div>


            </div>

        </header>



        <!-- ============== SIDE BAR ============== -->

        <aside class="sideBar" id="sideBar">


            <!-- SIDE HEADER -->

            <div class="sideHeader" id="sideHeader">

                <div class="role">
                    T
                </div>

                <p class="techName"></p>

            </div>


            <!-- NAVIGATION -->

            <nav class="nav">

                <ul class="linksCount">

                    <li class="liLinks">
                        <a href="../homePage/index.html">Dashboard</a>
                    </li>

                    <li class="liLinks">
                        <a href="students.html">Students</a>
                    </li>

                    <li class="liLinks">
                        <a href="../Assessments/index.html">Assessments</a>
                    </li>

                    <li class="liLinks">
                        <a href="../Reports/index.html">Reports</a>
                    </li>

                </ul>

            </nav>

        </aside>



        <!-- ============== MAIN CONTENT ============== -->

        <main class="main">

            <section>

                <div class="Containner">

                    <div class="MainHeader">

                        <h2>
                            <span>ALL</span> Students
                        </h2>

                        <div class="form-inline">
                            <a class="btn btn-outline-success" id="addStudentBtn" href="addnew.html">Add</a>
                        </div>

                    </div>

                    <div class="StudentData" id="StudentData"></div>

                </div>

            </section>

        </main>

    </div>


    <script src="stu.js"></script>
</body>

</html>
