<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessments</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="mainCountainer">

        <!-- ============== SIDE BAR ============== -->

        <aside class="sideBar" id="sideBar">

            <div class="sideHeader" id="sideHeader">
                <div class="role">T</div>
            </div>

            <nav class="nav">
                <ul class="linksCount">
                    <li class="liLinks"><a href="index.html">Dashboard</a></li>
                    <li class="liLinks"><a href="students.html">Students</a></li>
                    <li class="liLinks"><a href="assessments.html">Assessments</a></li>
                    <li class="liLinks"><a href="reports.html">Reports</a></li>
                </ul>
            </nav>

        </aside>


        <!-- ============== HEADER ============== -->

        <header class="header">

            <div class="headerCountent">

                <!-- ACCOUNT OPTIONS -->
                <div class="account" id="account">

                    <!-- logo + name are filled by index.js -->
                    <div class="logo" id="logo"></div>
                    <div class="headerName" id="name"></div>

                    <div>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m6 9 6 6 6-6"></path>
                        </svg>
                    </div>

                    <div class="accountMinu" id="accountMinu">
                        <p class="options"><a href="account.html">Account</a></p>
                        <p class="options"><a href="settings.html">Settings</a></p>
                        <p class="options" id="logoutBtn">Logout</p>
                    </div>

                </div>

                <!-- SEARCH BAR -->
                <div class="search">

                    <button class="searchBtn" id="searchBtn" type="button" aria-label="Search">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m21 21-4.34-4.34"></path>
                            <circle cx="11" cy="11" r="8"></circle>
                        </svg>
                    </button>

                    <input type="text" class="searchInput" id="searchInput" placeholder="Search">

                </div>

                <!-- BURGER MENU -->
                <div class="burgerMinu" id="burgerMinu">
                    <span class="borderMinu"></span>
                    <span class="borderMinu"></span>
                    <span class="borderMinu"></span>
                </div>

            </div>

        </header>


        <!-- ============== PAGE CONTENT ============== -->

        <main>

            <div class="pageHeader">
                <h1>Assessments</h1>
                <div>
                    <button id="addCourse">+ Add Course</button>
                    <button id="addAssessment">+ Add Assessment</button>
                </div>
            </div>

            <!-- Courses -->
            <section>
                <h2>Courses</h2>
                <div id="courses"><!-- Courses will be added by JavaScript --></div>
            </section>

            <!-- Assessments -->
            <section>
                <h2>Assessments</h2>
                <div id="assessments"><!-- Assessments will be added by JavaScript --></div>
            </section>

            <!-- Students -->
            <section id="studentsSection">
                <h2>Students</h2>
                <div id="students"><!-- Students will be added by JavaScript --></div>
                <button id="saveMarks">Save Marks</button>
            </section>

        </main>

    </div>


    <div id="messagePopup" class="message-popup"></div>


    <!-- Add Course -->
    <div id="courseModal" style="display: none;">
        <div>
            <button id="closeCourseModal">X</button>
            <h2>Add Course</h2>

            <form id="courseForm">
                <label for="courseName">Course Name</label>
                <input type="text" id="courseName" placeholder="Course name">

                <button type="submit">Add</button>
            </form>
        </div>
    </div>

    <!-- Add Assessment -->
    <div id="assessmentModal" style="display: none;">
        <div>
            <button id="closeModal">X</button>
            <h2>Add Assessment</h2>

            <form id="assessmentForm">

                <label for="assessmentName">Assessment Name</label>
                <input type="text" id="assessmentName" placeholder="Assessment name">

                <label for="type">Type</label>
                <select id="type">
                    <option value="task">Task</option>
                    <option value="project">Project</option>
                </select>

                <label for="maxScore">Maximum Score</label>
                <input type="number" id="maxScore" value="100">

                <button type="submit">Add</button>

            </form>
        </div>
    </div>

    <!-- Update Course -->
    <div id="editCourseModal" style="display: none;">
        <div>
            <button id="closeEditCourseModal">X</button>
            <h2>Update Course</h2>

            <form id="editCourseForm">
                <label for="editCourseName">Course Name</label>
                <input type="text" id="editCourseName" placeholder="Course name" required>

                <button type="submit">Save</button>
            </form>
        </div>
    </div>

    <!-- Update Assessment -->
    <div id="editAssessmentModal" style="display: none;">
        <div>
            <button id="closeEditAssessmentModal">X</button>
            <h2>Update Assessment</h2>

            <form id="editAssessmentForm">
                <label for="editAssessmentName">Assessment Name</label>
                <input type="text" id="editAssessmentName" placeholder="Assessment name" required>

                <label for="editAssessmentType">Type</label>
                <select id="editAssessmentType">
                    <option value="task">Task</option>
                    <option value="project">Project</option>
                </select>

                <label for="editAssessmentMaxScore">Maximum Score</label>
                <input type="number" id="editAssessmentMaxScore" min="1" required>

                <button type="submit">Save</button>
            </form>
        </div>
    </div>


    <script src="./index.js"></script>
</body>

</html>
