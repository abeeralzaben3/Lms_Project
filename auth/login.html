<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mudarris - Login</title>

  <!-- Plus Jakarta Sans Font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons Library -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth">
    <!-- Purple Side Panel -->
    <div class="auth__panel">
      <!-- Small Floating Background Circle -->
      <div class="small-circle"></div>

      <!-- Top Floating Card (Students Count) -->
      <div class="info-card">
        <span>Students</span>
        <strong>128 <i class="fa-solid fa-users"></i></strong>
      </div>

      <!-- Main Panel Content -->
      <div class="auth__panel-content">
        <div class="logo logo--white">
          <i class="fa-solid fa-graduation-cap"></i>
          <span class="logo__text">Mudarris</span>
        </div>
        <h2>Manage Your Students Effortlessly</h2>
        <p>Grades, attendance, and progress all in one place</p>

        <div class="panel-icons">
          <i class="fa-solid fa-book-open"></i>
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
      </div>

      <!-- Bottom Floating Card (Attendance Rate) -->
      <div class="info-card second-card">
        <span>Attendance Rate</span>
        <strong>94% <i class="fa-solid fa-chart-line"></i></strong>
      </div>
    </div>

    <!-- Form Side (Welcome Back) -->
    <div class="auth__form-side">
      <div class="auth__box">

        <h1 class="auth__title">Welcome back 👋</h1>
        <p class="auth__subtitle">Sign in to your account to continue</p>

        <!-- رسالة الخطأ (login.js بيكتب فيها) -->
        <div class="form-error" id="formError" role="alert"></div>

        <!-- id="loginForm" و name لكل حقل: login.js بيعتمد عليهم -->
        <form id="loginForm" dir="ltr" novalidate>
          <!-- Email Field -->
          <div class="field">
            <label for="email">Email Address</label>
            <div class="input-wrap">
              <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email">
            </div>
          </div>

          <!-- Password Field -->
          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
              <button type="button" class="toggle-pass" aria-label="Toggle password visibility">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me / Forgot Password -->
          <div class="form-meta">
            <label class="check">
              <input type="checkbox" id="remember" name="remember">
              <span>Remember me</span>
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn">Sign In</button>
        </form>

        <p class="switch">
          Don't have an account? <a href="rej.html">Create an account</a>
        </p>

      </div>
    </div>
  </div>

  <!-- لازم type="module" لأن login.js بيستخدم import -->
  <script type="module" src="login.js"></script>
</body>
</html>
