<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Reports</title>
    <link rel="stylesheet" href="./reports.css">
</head>

<body>

    <div class="mainCountainer">

        <!-- ============== SIDE BAR ============== -->
        <aside class="sideBar" id="sideBar">
            <div class="sideHeader" id="sideHeader">
                <div class="role">T</div>
            </div>

            <nav class="nav">
            <ul class="linksCount">
                    <li class="liLinks"><a href="../homePage/index.html">Dashboard</a></li>
                    <li class="liLinks"><a href="../Student/students.html">Students</a></li>
                    <li class="liLinks"><a href="../Assessments/index.html">Assessments</a></li>
                    <li class="liLinks"><a href="./index.html">Reports</a></li>
                </ul>
            </nav>
        </aside>

        <!-- ============== HEADER ============== -->
        <header class="header">
            <div class="headerCountent">

                <div class="account" id="account">
                    <div class="logo" id="logo"></div>
                    <div class="headerName" id="name"></div>

                    <div>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m6 9 6 6 6-6"></path>
                        </svg>
                    </div>

                    <div class="accountMinu" id="accountMinu">

    <a class="options" id="settings" href="../Settings/index.html">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="20" height="20"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">

            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />

            <circle cx="12" cy="12" r="3" />
        </svg>

        Settings
    </a>

    <p class="options" id="logout">
        <!-- logout SVG -->
        Log out
    </p>

</div>
                </div>

                <div class="search"></div>

                <div class="burgerMinu" id="burgerMinu">
                    <span class="borderMinu"></span>
                    <span class="borderMinu"></span>
                    <span class="borderMinu"></span>
                </div>

            </div>
        </header>

        <!-- ============== PAGE CONTENT ============== -->
        <main>

            <div class="pageHeader">
                <h1>Progress Reports</h1>

                <div class="report-controls">
                    <label for="courseSelect">Course</label>
                    <select id="courseSelect"></select>
                </div>
            </div>

            <p id="reportMessage" class="report-message"></p>

            <div id="reportContent">

                <!-- Summary numbers -->
                <div class="summary">
                    <div class="summary-card">
                        <span class="summary-label">Students</span>
                        <strong id="sumStudents">-</strong>
                    </div>
                    <div class="summary-card">
                        <span class="summary-label">Class average</span>
                        <strong id="sumAverage">-</strong>
                    </div>
                    <div class="summary-card">
                        <span class="summary-label">Highest</span>
                        <strong id="sumHighest">-</strong>
                    </div>
                    <div class="summary-card">
                        <span class="summary-label">Lowest</span>
                        <strong id="sumLowest">-</strong>
                    </div>
                    <div class="summary-card">
                        <span class="summary-label">Pass rate</span>
                        <strong id="sumPass">-</strong>
                    </div>
                </div>

                <!-- Charts -->
                <div class="charts">
                    <section>
                        <h2>Grade distribution</h2>
                        <div class="chart-wrap"><canvas id="distributionChart"></canvas></div>
                    </section>

                    <section>
                        <h2>Average per assessment</h2>
                        <div class="chart-wrap"><canvas id="assessmentChart"></canvas></div>
                    </section>
                </div>

                <!-- Table -->
                <section>
                    <h2>Student totals</h2>
                    <div class="table-wrap">
                        <table class="report-table">
                            <thead>
                                <tr>
                                    <th>Student</th>
                                    <th>ID</th>
                                    <th>Graded</th>
                                    <th>Total</th>
                                    <th>Percentage</th>
                                    <th>Grade</th>
                                </tr>
                            </thead>
                            <tbody id="reportRows"></tbody>
                        </table>
                    </div>
                </section>

            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./reports.js"></script>
</body>

</html>
