<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudarris - Dashboard</title>
    <link rel="stylesheet" href="reports.css">
</head>


<body>

    <div class="mainCountainer">

        <!-- ================= MAIN ================= -->

        <main class="content" id="main">


             <div class="pageHeader">
                <h1>Progress Reports</h1>

                <div class="report-controls">
                    <label for="courseSelect">Course</label>
                    <select id="courseSelect"></select>
                </div>
            </div>

            <p id="reportMessage" class="report-message"></p>

            <div id="reportContent">

                <!-- Summary numbers -->
                <div class="summary">
                    <div class="summary-card">
                        <span class="summary-label">Students</span>
                        <strong id="sumStudents">-</strong>
                    </div>
                    <div class="summary-card">
                        <span class="summary-label">Class average</span>
                        <strong id="sumAverage">-</strong>
                    </div>
                    <div class="summary-card">
                        <span class="summary-label">Highest</span>
                        <strong id="sumHighest">-</strong>
                    </div>
                    <div class="summary-card">
                        <span class="summary-label">Lowest</span>
                        <strong id="sumLowest">-</strong>
                    </div>
                    <div class="summary-card">
                        <span class="summary-label">Pass rate</span>
                        <strong id="sumPass">-</strong>
                    </div>
                </div>

                <!-- Charts -->
                <div class="charts">
                    <section>
                        <h2>Grade distribution</h2>
                        <div class="chart-wrap"><canvas id="distributionChart"></canvas></div>
                    </section>

                    <section>
                        <h2>Average per assessment</h2>
                        <div class="chart-wrap"><canvas id="assessmentChart"></canvas></div>
                    </section>
                </div>

                <!-- Table -->
                <section>
                    <h2>Student totals</h2>
                    <div class="table-wrap">
                        <table class="report-table">
                            <thead>
                                <tr>
                                    <th>Student</th>
                                    <th>ID</th>
                                    <th>Graded</th>
                                    <th>Total</th>
                                    <th>Percentage</th>
                                    <th>Grade</th>
                                </tr>
                            </thead>
                            <tbody id="reportRows"></tbody>
                        </table>
                    </div>
                </section>

            </div>

        </main>

    </div>   
     <script type="module">
        import { userId } from "../layout.js";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="reports.js">
    </script>

</body>

</html>
