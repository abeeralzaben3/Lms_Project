<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mudarris - Dashboard</title>

    <link rel="stylesheet" href="reports.css">

</head>


<body>

    <div class="mainCountainer">


        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="headerCountent">


                <!-- ACCOUNT -->

                <div class="account" id="account">

                    <div class="logo size" id="logo">
                        MH
                    </div>


                    <div class="headerName size" id="headerName">
                        Muhammad
                    </div>


                    <div>

                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                            <path d="m6 9 6 6 6-6"></path>

                        </svg>

                    </div>


                    <!-- ACCOUNT MENU -->

                    <div class="accountMinu" id="accountMinu">


                        <p class="options" id="settings" >
<!-- href="../Setting/index.html" -->
                            Settings

                        </p>


                        <p class="options" id="logout">

                            Log out

                        </p>


                    </div>

                </div>


                <!-- SEARCH -->

                <div class="search">

                    <button class="icons btn" id="searchBtn">
               <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                            <path d="m21 21-4.34-4.34"></path>

                            <circle cx="11" cy="11" r="8">
                            </circle>

                        </svg>

                    </button>


                    <input type="text" class="searchInput" id="searchInput" placeholder="Students Search">

                </div>


                <!-- BURGER -->

                <div class="burgerMinu" id="burgerMinu">

                    <span class="borderMinu"></span>
                    <span class="borderMinu"></span>
                    <span class="borderMinu"></span>

                </div>

            </div>

        </header>


        <!-- ================= SIDEBAR ================= -->

        <aside class="sideBar" id="sideBar">


            <div class="sideHeader" id="sideHeader">


                <div class="role">
                    T
                </div>


                <p class="techName" id="techName">

                    Muhammad Alshawabkeh

                </p>

            </div>


            <nav class="nav">

                <ul class="linksCount">


                    <li class="liLinks" id="dashboard">

                        <!-- href="./index.html"> -->
                            Dashboard
                        

                    </li>


                    <li class="liLinks" id="students">

                        <!-- href="../Student/students.html"> -->
                            Students
                        

                    </li>


                    <li class="liLinks" id="assessments">

                        <!-- href="../Assessments/index.html"> -->
                            Assessments
                        

                    </li>


                    <li class="liLinks" id="reports">

                         <!-- href="../Reports/index.html"> -->
                            Reports
                       
                    </li>

                </ul>

            </nav>

        </aside>


        <!-- ================= MAIN ================= -->

        <main class="content" id="main">


             <div class="pageHeader">
                <h1>Progress Reports</h1>

                <div class="report-controls">
                    <label for="courseSelect">Course</label>
                    <select id="courseSelect"></select>
                </div>
            </div>

            <p id="reportMessage" class="report-message"></p>

            <div id="reportContent">

                <!-- Summary numbers -->
                <div class="summary">
                    <div class="summary-card">
                        <span class="summary-label">Students</span>
                        <strong id="sumStudents">-</strong>
                    </div>
                    <div class="summary-card">
                        <span class="summary-label">Class average</span>
                        <strong id="sumAverage">-</strong>
                    </div>
                    <div class="summary-card">
                        <span class="summary-label">Highest</span>
                        <strong id="sumHighest">-</strong>
                    </div>
                    <div class="summary-card">
                        <span class="summary-label">Lowest</span>
                        <strong id="sumLowest">-</strong>
                    </div>
                    <div class="summary-card">
                        <span class="summary-label">Pass rate</span>
                        <strong id="sumPass">-</strong>
                    </div>
                </div>

                <!-- Charts -->
                <div class="charts">
                    <section>
                        <h2>Grade distribution</h2>
                        <div class="chart-wrap"><canvas id="distributionChart"></canvas></div>
                    </section>

                    <section>
                        <h2>Average per assessment</h2>
                        <div class="chart-wrap"><canvas id="assessmentChart"></canvas></div>
                    </section>
                </div>

                <!-- Table -->
                <section>
                    <h2>Student totals</h2>
                    <div class="table-wrap">
                        <table class="report-table">
                            <thead>
                                <tr>
                                    <th>Student</th>
                                    <th>ID</th>
                                    <th>Graded</th>
                                    <th>Total</th>
                                    <th>Percentage</th>
                                    <th>Grade</th>
                                </tr>
                            </thead>
                            <tbody id="reportRows"></tbody>
                        </table>
                    </div>
                </section>

            </div>

        </main>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="reports.js">
    </script>

</body>

</html>
