<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Mudarris - Login</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">


    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>


    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <link
        rel="stylesheet"
        href="/regester/style.css">

</head>


<body>


    <div class="auth">


        <!-- ================= PANEL ================= -->

        <div class="auth__panel">

            <div class="small-circle"></div>


            <div class="info-card">

                <span>
                    Students
                </span>

                <strong>
                    128
                    <i class="fa-solid fa-users"></i>
                </strong>

            </div>


            <div class="auth__panel-content">

                <div class="logo logo--white">

                    <i class="fa-solid fa-graduation-cap"></i>

                    <span class="logo__text">
                        Mudarris
                    </span>

                </div>


                <h2>
                    Manage Your Students Effortlessly
                </h2>


                <p>
                    Grades, attendance, and progress
                    all in one place
                </p>


                <div class="panel-icons">

                    <i class="fa-solid fa-book-open"></i>

                    <i class="fa-solid fa-graduation-cap"></i>

                </div>

            </div>


            <div class="info-card second-card">

                <span>
                    Attendance Rate
                </span>

                <strong>
                    94%
                    <i class="fa-solid fa-chart-line" ></i>
                </strong>

            </div>

        </div>


        <!-- ================= FORM ================= -->

        <div class="auth__form-side">

            <div class="auth__box">


                <h1 class="auth__title">
                    Welcome back 👋
                </h1>


                <p class="auth__subtitle">
                    Sign in to your account to continue
                </p>


                <div class="form-error" id="formError" role="alert"></div>


                <form
                    id="loginForm"
                    novalidate>
                    <!-- EMAIL -->
                    <div class="field">

                        <label for="email">
                            Email Address
                        </label>


                        <div class="input-wrap">

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="name@example.com"
                                autocomplete="email">

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="field">

                        <label for="password">
                            Password
                        </label>


                        <div class="input-wrap">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="••••••••"
                                autocomplete="current-password">


                            <button
                                type="button"
                                class="toggle-pass"
                                aria-label="Toggle password visibility"
                                id="toggle-pass">

                                <i class="fa-regular fa-eye" ></i>

                            </button>

                        </div>

                    </div>


                    <!-- REMEMBER -->

                    <div class="form-meta">

                        <label class="check">

                            <input
                                type="checkbox"
                                id="remember"
                                name="remember">

                            <span>
                                Remember me
                            </span>

                        </label>


                        <a href="#">
                            Forgot password?
                        </a>

                    </div>


                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        class="btn">

                        Log in

                    </button>

                </form>


                <p class="switch">

                    Don't have an account?

                    <a href="../regester/rejester.html">
                        Create an account
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script
        type="module"
        src="./login.js">
    </script>

</body>

</html>
